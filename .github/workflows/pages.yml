name: pages

# The catalog publishes its data to its `dist` branch on every change (the listing agent pushes several times a day).
# A cross-repo trigger would need a personal token, so instead this checks every hour whether `dist` moved since
# the deployed build (public/build-info.json) and rebuilds only then. Pushes here and manual runs always rebuild.
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 * * * *"
  repository_dispatch:
    types: [catalog-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.dist.outputs.sha }}
      build: ${{ steps.dist.outputs.build }}
    steps:
      - id: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/YangmaoSwitch/catalog/commits/dist | jq -r .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          live=$(curl -fsSL "https://yangmaoswitch.github.io/website/build-info.json?t=$(date +%s)" | jq -r '.catalog_dist // ""' || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$sha" ] && [ "$sha" = "$live" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "catalog dist unchanged ($sha), nothing to rebuild"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "building with catalog dist $sha (live: ${live:-none})"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      # read the data at that exact commit: the branch URL can be served from a cache a few minutes old
      - env:
          YM_CATALOG_DIST_SHA: ${{ needs.check.outputs.sha }}
        run: |
          base=https://raw.githubusercontent.com/YangmaoSwitch/catalog/${YM_CATALOG_DIST_SHA:-dist}
          python build.py "$base/catalog.json" "$base/models.json"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Separate job: deploying right after the upload in the same job often failed with
  # "No artifacts named github-pages were found" (the artifact was not visible yet).
  # The deploy is also retried once after a pause.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
